---
- name: Tareas previas al deploy de roles
  hosts: laptop
  tags: always
  become: true
  pre_tasks:
    - name: Actualizar caché
      tags: always
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

- name: Deploy roles
  hosts: laptop
  become: true
  roles:
    - diego

- name: Completar deploy y limpiar caché
  hosts: laptop
  become: true
  tasks:
    - name: Cleanup package cache (debian)
      tags: always
      ansible.builtin.apt:
        autoclean: true
      changed_when: false

    - name: Autoremove orphan packages (debian)
      tags: always
      ansible.builtin.apt:
        autoremove: true
        purge: true
