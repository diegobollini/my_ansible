---
- name: SSH - Key y config
  tags: ssh
  become: true
  become_user: "{{ diego_remote_regular_user }}"
  block:
    - name: SSH - Crear ~/.ssh si no existe
      ansible.builtin.file:
        path: "{{ diego_remote_home }}/.ssh"
        state: directory
        mode: "0700"

    - name: SSH - Copiar llave pública
      ansible.builtin.copy:
        src: ./files/private_key_diego.pub
        dest: "{{ diego_remote_home }}/.ssh/private_key_diego.pub"
        mode: "0644"

    - name: SSH - Copiar configuración base (versionada)
      ansible.builtin.copy:
        src: ./files/ssh_config
        dest: "{{ diego_remote_home }}/.ssh/config"
        mode: "0644"

    - name: SSH - Crear config.local si no existe (hosts privados, no versionado)
      ansible.builtin.copy:
        content: "# Hosts privados propios de esta máquina. No se versiona en git.\n"
        dest: "{{ diego_remote_home }}/.ssh/config.local"
        mode: "0600"
        force: false
