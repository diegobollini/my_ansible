---
- name: UFW - Instalar y configurar firewall
  tags: ufw
  block:
    - name: Instalar UFW
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - ufw
          - gufw

    - name: Bloquear todas las conexiones entrantes
      community.general.ufw:
        rule: deny
        direction: in

    - name: Permitir salida SSH
      community.general.ufw:
        rule: allow
        direction: out
        port: "22"
        proto: tcp

    - name: Permitir salida HTTP
      community.general.ufw:
        rule: allow
        direction: out
        port: "80"
        proto: tcp

    - name: Permitir salida HTTPS
      community.general.ufw:
        rule: allow
        direction: out
        port: "443"
        proto: tcp

    - name: Permitir salida DNS
      community.general.ufw:
        rule: allow
        direction: out
        port: "53"
        proto: "{{ item }}"
      loop:
        - tcp
        - udp

    - name: Permitir salida NTP
      community.general.ufw:
        rule: allow
        direction: out
        port: "123"
        proto: udp

    - name: Activar UFW
      community.general.ufw:
        state: enabled
