---
# unrar/p7zip-rar viven en "non-free" y ttf-mscorefonts-installer en "contrib".
# El instalador de Debian los deja sin habilitar por defecto.
- name: Paquetes - Verificar que los componentes contrib/non-free estén habilitados
  ansible.builtin.command: "apt-cache policy {{ item }}"
  register: diego_component_check
  changed_when: false
  failed_when: diego_component_check.stdout | trim | length == 0
  loop:
    - ttf-mscorefonts-installer
    - unrar
  tags: [packages, packages_other, packages_compression]

- name: Base - Instalar paquetes de sistema
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - htop
      - mc
      - tmux
      - apt-transport-https
      - curl
      - wget
      - openssh-client
      - openssh-server
      - jq
      - tldr-py
      - plocate
      - libxshmfence1
  tags: [packages, packages_system]

- name: Base - Utilidades de compresión
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - zip
      - gzip
      - tar
      - unrar
      - unzip
      - p7zip-full
      - p7zip-rar
  tags: [packages, packages_compression]

- name: Base - Aceptar licencia de mscorefonts de forma no interactiva
  ansible.builtin.debconf:
    name: ttf-mscorefonts-installer
    question: msttcorefonts/accepted-mscorefonts-eula
    value: "true"
    vtype: select
  tags: [packages, packages_other]

- name: Base - Instalar otras aplicaciones
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - poedit
      - fail2ban
      - ufw
      - vlc
      - ffmpeg
      - libavcodec-extra
      - ttf-mscorefonts-installer
      - transmission-gtk
      - flameshot
  tags: [packages, packages_other]

- name: Base - Análisis de Hardware, información del sistema
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - inxi
      - hwinfo
      - glances
      - mtr
      - hardinfo2
      - screenfetch
  tags: [packages, packages_hardware]

- name: Base - Performance y rendimiento de batería
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - powertop
      - acpi-call-dkms
      - preload
      - bleachbit
      - synaptic
      - nala
  tags: [packages, packages_performance]

- name: Editor de texto, colorizer, terminal
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - ccze
      - tmuxp
      - xclip
      - bash-completion
      - yakuake
      - fonts-firacode
  tags: [packages, packages_dev]
