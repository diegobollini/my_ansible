---
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar ansible-core y ansible-lint
        run: pip install ansible-core ansible-lint

      - name: Instalar dependencias de Ansible Galaxy
        run: ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook playbooks/notebook.yml --syntax-check

  check-debian-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install pyyaml

      - name: Descargar índices de paquetes de Debian trixie
        run: |
          mkdir -p /tmp/debian-index
          for comp in main contrib non-free non-free-firmware; do
            curl -fsSL "http://deb.debian.org/debian/dists/trixie/$comp/binary-amd64/Packages.gz" \
              -o "/tmp/debian-index/$comp.gz"
            gunzip -f "/tmp/debian-index/$comp.gz"
          done

      - name: Validar paquetes referenciados contra los repos de Debian
        run: python3 scripts/check_debian_packages.py /tmp/debian-index/*
